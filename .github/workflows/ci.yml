name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Chrome
        run: |
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome.deb || sudo apt-get -f install -y
          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke suite (headless)
        env:
          HEADLESS: "1"
        run: python -m pytest -m smoke -o addopts="-q --tb=short" --html=reports/smoke_report.html --self-contained-html

      - name: Run negative cases (headless)
        env:
          HEADLESS: "1"
        run: python -m pytest -m negative -o addopts="-q --tb=short" --html=reports/negative_report.html --self-contained-html

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            reports/
            screenshots/
            logs/
          if-no-files-found: ignore
